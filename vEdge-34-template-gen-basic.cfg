 system
 system-ip             1.1.34.34
 overlay-id            1
 site-id               34
 no transport-gateway enable
 port-offset           0
 control-session-pps   300
 admin-tech-on-failure
 sp-organization-name  thebiglab
 organization-name     thebiglab
 port-hop
 track-transport
 track-default-gateway
 console-baud-rate     9600
 no on-demand enable
 on-demand idle-timeout 10
 vbond 39.1.1.6 port 12346
!
banner login \x03Un authorised Logins tracked\x03
banner motd \x03Restricted Use\x03
service timestamps debug datetime msec
service timestamps log datetime msec
service tcp-keepalives-in
service tcp-keepalives-out
no service tcp-small-servers
no service udp-small-servers
hostname vEdge-34
username admin privilege 15 secret 9 $9$3VQD2lIM2/2I3E$LPDDmfEqbrQ16c2/GRabZ7JhmFo0wDE9Sm6j3Ljve46
vrf definition Mgmt-intf
 description Management
 rd          1:512
 address-family ipv4
  route-target export 1:512
  route-target import 1:512
  exit-address-family
