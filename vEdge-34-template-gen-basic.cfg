!
ip arp proxy disable
ip forward-protocol nd
no ip ftp passive
ip name-server 192.168.53.1 1.1.1.1
ip route 0.0.0.0 0.0.0.0 39.1.1.33
ip scp server enable
ip bootp server
no ip source-route
no ip ssh bulk-mode
